<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tickets — The Spoiler House</title>
  <link rel="stylesheet" href="Style.css">
  <link rel="stylesheet" href="booking.css">
  <link rel="stylesheet" href="ticket.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="booking-body">

<header class="bk-topbar">
  <a href="index.html" class="bk-back" aria-label="Back to home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <a href="index.html" class="bk-logo serif">The Spoiler House</a>
  <div class="bk-topbar-spacer"></div>
  <div class="lang-switch" id="langSwitch">
    <button class="active" data-lang="en">EN</button>
    <button data-lang="kh">KH</button>
  </div>
</header>

<main id="tixMain"></main>

<script>
(function(){
  const main = document.getElementById('tixMain');

  let tickets = [];
  try{ tickets = JSON.parse(localStorage.getItem('sh_tickets') || '[]'); }
  catch(e){ tickets = []; }

  if(!tickets.length){
    main.innerHTML = `
      <div class="tix-empty-wrap">
        <div class="tix-empty-icon">🎟</div>
        <div class="tix-empty-title serif">No tickets yet</div>
        <p class="tix-empty-sub">
          Your booked tickets and e-tickets will show up here after checkout.
        </p>
        <div class="tix-empty-actions">
          <a href="Rerng.html#movies" class="btn btn-primary">Browse Movies</a>
          <a href="Rerng.html" class="btn btn-ghost">Back to Home</a>
        </div>
      </div>`;
    return;
  }

  function formatBookedAt(iso){
    try{
      const d = new Date(iso);
      return 'Booked ' + d.toLocaleDateString('en', {month:'short', day:'numeric', year:'numeric'}) +
             ' at ' + d.toLocaleTimeString('en', {hour:'numeric', minute:'2-digit'});
    }catch(e){ return ''; }
  }

  function downloadTicket(t){
    const fnbRows = (t.fnb && t.fnb.length)
      ? t.fnb.map(f => `<div class="meta">${f.qty}× ${f.name} — $${(f.price*f.qty).toFixed(2)}</div>`).join('')
      : '';
    const html = `<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<title>E-Ticket — ${t.code}</title>
<style>
  body{font-family:'Inter',Arial,sans-serif;background:#0A0A0A;color:#fff;margin:0;padding:40px;}
  .ticket{max-width:420px;margin:0 auto;background:#141414;border:1px solid #27272A;border-radius:24px;padding:28px;}
  .top{display:flex;gap:14px;}
  .poster{width:72px;height:104px;border-radius:10px;object-fit:cover;flex-shrink:0;}
  .title{font-size:19px;font-weight:700;margin-bottom:6px;}
  .meta{font-size:13px;color:#A1A1AA;margin-top:3px;}
  .divider{height:1px;background:#27272A;margin:20px 0;}
  .fnb-label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#71717A;margin-bottom:8px;}
  .bottom{display:flex;align-items:center;justify-content:space-between;}
  .code{font-size:17px;font-weight:700;letter-spacing:.05em;color:#E50914;}
  .qr{font-size:46px;line-height:1;}
  .brand{text-align:center;font-size:12px;color:#71717A;margin-top:24px;letter-spacing:.04em;}
<\/style></head>
<body>
  <div class="ticket">
    <div class="top">
      <img class="poster" src="${t.poster}" alt="">
      <div>
        <div class="title">${t.title}</div>
        <div class="meta">${t.cinema}</div>
        <div class="meta">${t.date} · ${t.showtime}</div>
        <div class="meta">Seats: ${t.seats}</div>
      </div>
    </div>
    ${fnbRows ? `<div class="divider"></div><div class="fnb-label">Food &amp; Drinks</div>${fnbRows}` : ''}
    <div class="divider"></div>
    <div class="bottom">
      <div class="code">${t.code}</div>
      <div class="qr">▦</div>
    </div>
  </div>
  <div class="brand">THE SPOILER HOUSE CINEMA — Show this at the entrance</div>
<\/body><\/html>`;
    const blob = new Blob([html], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `e-ticket-${t.code}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  main.innerHTML = `
    <div class="tix-page">
      <div class="tix-page-head">
        <div class="tix-page-title serif">My Tickets</div>
        <div class="tix-page-sub">${tickets.length} ticket${tickets.length>1?'s':''} booked on this device</div>
      </div>
      <div class="tix-list" id="tixList"></div>
    </div>`;

  const list = document.getElementById('tixList');
  tickets.slice().reverse().forEach((t, i) => {
    const card = document.createElement('div');
    card.className = 'tix-card';
    const fnbHtml = (t.fnb && t.fnb.length) ? `
        <div class="bk-ticket-divider"></div>
        <div class="bk-ticket-fnb">
          <div class="bk-ticket-fnb-label">Food &amp; Drinks</div>
          ${t.fnb.map(f => `<div class="bk-ticket-fnb-row"><span>${f.qty}× ${f.name}</span><span>$${(f.price*f.qty).toFixed(2)}</span></div>`).join('')}
        </div>` : '';
    card.innerHTML = `
      <div class="tix-booked-at">${formatBookedAt(t.bookedAt)}</div>
      <div class="bk-ticket">
        <div class="bk-ticket-top">
          <img src="${t.poster}" class="bk-ticket-poster" alt="${t.title}">
          <div class="bk-ticket-info">
            <div class="bk-ticket-title serif">${t.title}</div>
            <div class="bk-ticket-meta">${t.cinema}</div>
            <div class="bk-ticket-meta">${t.date} · ${t.showtime}</div>
            <div class="bk-ticket-meta">Seats: ${t.seats}</div>
          </div>
        </div>
        ${fnbHtml}
        <div class="bk-ticket-divider"></div>
        <div class="bk-ticket-bottom">
          <div class="bk-ticket-code">${t.code}</div>
          <div class="bk-ticket-qr">▦</div>
        </div>
      </div>
      <div class="tix-card-actions">
        <button class="btn btn-ghost" data-i="${i}">Download Again</button>
      </div>`;
    card.querySelector('[data-i]').addEventListener('click', () => downloadTicket(t));
    list.appendChild(card);
  });
})();
</script>
</body>
</html>
